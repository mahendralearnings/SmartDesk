services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT:-5000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - mlflow
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    command: >
      uv run uvicorn smartdesk.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  mlflow:
    image: python:3.12-slim
    env_file:
      - .env
    working_dir: /mlflow
    volumes:
      - ./mlruns:/mlflow/mlruns
      - ./mlflow.db:/mlflow/mlflow.db
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    command: >
      sh -c "pip install --no-cache-dir mlflow &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI:-sqlite:///mlflow.db}
      --default-artifact-root ${MLFLOW_DEFAULT_ARTIFACT_ROOT:-/mlflow/mlruns}"
