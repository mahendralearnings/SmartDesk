[project]
name = "smartdesk"
version = "0.1.0"
description = "Enterprise Document Intelligence Platform"

requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    # Logging
    "structlog>=24.1",
    # Phase 1: Preprocessing
    "nltk>=3.8",
    "spacy>=3.7",
    "regex>=2024.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "ftfy>=6.1",
    "emoji>=2.10",
    # Phase 2: Classical ML
    "scikit-learn>=1.4",
    "joblib>=1.3",
    # Phase 3: Embeddings
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "anthropic>=0.97.0",
    "openai>=2.32.0",
    "mcp>=1.27.0",
    "langsmith>=0.1",
    "ragas>=0.4.3",
    "dataset>=2.0.0",
    "datasets>=4.8.4",
    "langchain-anthropic>=1.4.1",
    "langchain-community>=0.4.1",
    "mlflow>=3.11.1",
]

# ── uv-native dependency groups (replaces [project.optional-dependencies]) ──
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "ipython>=8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "peft>=0.11",
    "transformers>=4.40",
    "datasets>=2.19",
    "bitsandbytes>=0.43",   ## needed for QLoRA 4-bit
    "accelerate>=0.30",
    "evaluate>=0.4",
    "seqeval>=1.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "mcp>=1.0",
    "anthropic>=0.40",
    "mlflow>=2.12",
    "ragas>=0.1",
    "datasets>=2.19",
    "langsmith>=0.1",
    "prometheus-client>=0.20",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]
ml = [
  "spacy>=3.7,<4",
  "torch>=2.2",
  "transformers>=4.40",
  "sentence-transformers>=3.0",
  # ... existing deps
  "seqeval>=1.2.2",
  "datasets>=4.8.4",
  "evaluate>=0.4.6",
]
# ── Tool configs ──
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers --cov=src/smartdesk --cov-report=term-missing"

# ── Build system ──
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartdesk"]


