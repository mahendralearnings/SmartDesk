[project]
name = "smartdesk"
version = "0.1.0"
description = "Enterprise Document Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    # Logging
    "structlog>=24.1",
    # Phase 1: Preprocessing
    "nltk>=3.8",
    "spacy>=3.7",
    "regex>=2024.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "ftfy>=6.1",
    "emoji>=2.10",
    # Phase 2: Classical ML
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

# ── uv-native dependency groups (replaces [project.optional-dependencies]) ──
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "ipython>=8.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

# ── Tool configs ──
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers --cov=src/smartdesk --cov-report=term-missing"

# ── Build system ──
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartdesk"]
