# .github/workflows/ci.yml
name: SmartDesk CI/CD

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Check imports work
        run: |
          uv run python -c "
          from smartdesk.rag.rag_pipeline import RAGPipeline
          from smartdesk.agents.react_agent import ReActAgent
          from smartdesk.mcp.server import app
          print('All imports OK')
          "

      - name: Run unit tests
        run: |
          uv run pytest tests/ -v --tb=short
        continue-on-error: true  # don't fail if no tests yet

      - name: Verify FastAPI starts
        run: |
          uv run python -c "
          from smartdesk.api.main import app
          print('FastAPI app loads OK')
          "

  docker:
    needs: test          # only runs if test job passes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # only on main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t smartdesk:${{ github.sha }} .

      - name: Verify container starts
        run: |
          docker run -d \
            --name test-container \
            -p 8000:8000 \
            -e ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} \
            -e LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }} \
            -e LANGCHAIN_TRACING_V2=false \
            smartdesk:${{ github.sha }}
          sleep 15
          curl -f http://localhost:8000/health
          docker stop test-container

      - name: Tag as latest
        run: |
          docker tag smartdesk:${{ github.sha }} smartdesk:latest
          echo "Image smartdesk:latest ready for deployment"